<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon premier site sur Docker !</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; }
        p { color: #94a3b8; font-size: 1.1em; }
        .badge {
            background-color: #0284c7;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Bienvenue sur mon site Dockerisé !</h1>
        <p>Ce site tourne dans un conteneur Nginx totalement isolé.</p>
        <span class="badge">Platform Engineering in Progress</span>
    </div>
</body>
</html>
